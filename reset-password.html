<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf8f5">
<title>Reset your password — JobCards.io</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--card:#fff;--line:#dfd8cc;--ink:#161619;--muted:#6b675f;--purple:#673de6;--lime:#d8fb45;--red:#a33139;--font:"Plus Jakarta Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);display:grid;place-items:center;padding:24px}.shell{width:min(100%,470px)}.logo{font-size:23px;font-weight:900;margin-bottom:22px;text-align:center}.logo span{color:var(--purple)}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 24px 70px rgba(30,24,18,.1)}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--purple);font-weight:900}.card h1{font-size:30px;letter-spacing:-1.2px;margin:11px 0 7px}.lead{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 22px}label{display:block;font-size:10px;font-weight:900;letter-spacing:.65px;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font:inherit}button{width:100%;border:0;border-radius:999px;background:var(--lime);padding:13px;margin-top:20px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{min-height:22px;text-align:center;margin-top:15px;font-size:12px;font-weight:800;color:var(--muted)}.message.error{color:var(--red)}.back{text-align:center;margin-top:17px;font-size:11px}.back a{color:var(--purple);font-weight:900}.invalid{display:none}.invalid.show{display:block}.invalid.show+form{display:none}
</style>
</head>
<body>
<main class="shell">
<div class="logo">JobCards<span>.io</span></div>
<section class="card">
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Choose a new password.</h1>
  <p class="lead">Use at least eight characters. Your new password will replace the one you used before.</p>
  <div class="invalid" id="invalid"><p class="lead">This recovery link is missing, invalid, or expired. Request a new password-reset email from the JobCards sign-in form.</p></div>
  <form id="reset-form">
    <label for="password">NEW PASSWORD</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
    <label for="confirm-password">CONFIRM PASSWORD</label>
    <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat your new password">
    <button type="submit">Update password →</button>
  </form>
  <div class="message" id="message" role="status" aria-live="polite"></div>
  <div class="back"><a href="/?signin=1">Back to sign in</a></div>
</section>
</main>
<script>
(() => {
  const SUPABASE_URL='https://owunbhxntjvvvbqniiku.supabase.co';
  const KEY='sb_publishable_T1788-CUfSwvCHf9tymFkQ_uS-MiTiw';
  const params=new URLSearchParams(location.hash.slice(1));
  const accessToken=params.get('access_token');
  const refreshToken=params.get('refresh_token');
  const expiresIn=Number(params.get('expires_in')||3600);
  const errorDescription=params.get('error_description');
  const form=document.getElementById('reset-form');
  const message=document.getElementById('message');
  const invalid=document.getElementById('invalid');

  history.replaceState({},document.title,location.pathname);

  if(!accessToken||errorDescription){
    invalid.classList.add('show');
    message.textContent=errorDescription?decodeURIComponent(errorDescription.replace(/\+/g,' ')):'';
    message.classList.add('error');
    return;
  }

  form.addEventListener('submit',async event=>{
    event.preventDefault();
    message.className='message';
    const password=document.getElementById('password').value;
    const confirmation=document.getElementById('confirm-password').value;
    const button=form.querySelector('button');

    if(password!==confirmation){
      message.textContent='Your passwords do not match.';
      message.classList.add('error');
      return;
    }

    button.disabled=true;
    button.textContent='Updating…';
    try{
      const response=await fetch(SUPABASE_URL+'/auth/v1/user',{
        method:'PUT',
        headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
        body:JSON.stringify({password})
      });
      const payload=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(payload.message||payload.msg||'We could not update your password.');
      localStorage.setItem('jobcards-session',JSON.stringify({
        access_token:accessToken,
        refresh_token:refreshToken,
        expires_at:Math.floor(Date.now()/1000)+expiresIn,
        user:payload
      }));
      message.textContent='Password updated. Opening your workspace…';
      setTimeout(()=>location.replace('/app.html'),700);
    }catch(error){
      message.textContent=error.message||'Network error. Please try again.';
      message.classList.add('error');
      button.disabled=false;
      button.textContent='Update password →';
    }
  });
})();
</script>
</body>
</html>
